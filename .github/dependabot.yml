version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      bun:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns:
          - '*'
