  - id: vehicle_speed
    name: 'Vehicle Speed'
    description: 'Vehicle ground speed'
    category: speed
    data_type: float
    unit: 'kph'
    min: 0
    max: 200
    precision: 0
    source_names:
      - 'Vehicle Speed'
      - 'Vehicle Speed (mph)'
      - 'Speed'
      - 'VSS'


  # Status
  - id: ac_relay
    name: 'A/C Relay'
    description: 'Air conditioning clutch relay state.'
    category: status
    data_type: bool
