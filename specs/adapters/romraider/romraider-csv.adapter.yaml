# OpenECU Alliance Adapter Specification
# RomRaider CSV Log Format (Subaru ECUs)

openecualliance: '1.0'
id: romraider-csv
name: 'RomRaider CSV Log'
version: '1.2.0'
vendor: romraider
description: |
  CSV log files generated by RomRaider ECU logging software.
  Commonly used for Subaru ECUs with OpenPort cables.

  Format characteristics:
  - Comma (US locale) or semicolon (European locale) delimiter
  - European locale uses comma as decimal separator (e.g., "14,00")
  - First column is Time in milliseconds
  - Channel names include units in parentheses (e.g., "Engine Speed (rpm)")
  - Subaru-specific parameters like IAM, A/F Learning, etc.
website: 'https://www.romraider.com'
branding:
  logo: romraider-logo.gif
  icon: romraider-icon.gif
  banner: romraider-banner.png
  color_primary: '#2B579A'
  color_secondary: '#1E3A5F'

file_format:
  type: csv
  extensions: ['.csv', '.log']
  encoding: utf-8
  delimiter: ',' # US locale; European uses semicolon
  header_row: 0
  data_start_row: 1
  timestamp_column: 'Time'
  timestamp_unit: milliseconds

channels:

  # Correction
  - id: af_learning
    name: 'A/F Learning'
    description: 'Long-term fuel trim / A/F Learning value'
    category: correction
    data_type: float
    unit: 'percent'
    min: -25
    max: 25
    precision: 1
    source_names:
      - 'A/F Learning #1'
      - 'A/F Learning #1 (%)'
      - 'A/F Learning'
      - 'LTFT'
      - 'Long Term Fuel Trim'
      - 'Air/Fuel Learning #1'

  - id: afr_correction
    name: 'A/F Correction'
    description: 'Short-term fuel trim from A/F sensor'
    category: correction
    data_type: float
    unit: 'percent'
    min: -25
    max: 25
    precision: 1
    source_names:
      - 'A/F Correction #1'
      - 'A/F Correction #1 (%)'
      - 'A/F Correction'
      - 'STFT'
      - 'Short Term Fuel Trim'
      - 'Air/Fuel Correction #1'

  - id: dam
    name: 'DAM'
    description: 'Dynamic Advance Multiplier'
    category: correction
    data_type: float
    unit: 'multiplier'
    min: 0
    max: 1
    precision: 3
    source_names:
      - 'DAM'
      - 'Dynamic Advance Multiplier'
      - 'Dynamic Adv Multiplier'
      - 'Advance Multiplier'

  - id: feedback_knock
    name: 'Feedback Knock Correction'
    description: 'Real-time knock retard'
    category: correction
    data_type: float
    unit: 'degrees'
    min: -20
    max: 0
    precision: 2
    source_names:
      - 'Feedback Knock Correction'
      - 'Feedback Knock Correction (degrees)'
      - 'Knock Correction'
      - 'FBKC'

  - id: fine_knock_learning
    name: 'Fine Knock Learning'
    description: 'Fine knock learning value per cylinder'
    category: correction
    data_type: float
    unit: 'degrees'
    min: -10
    max: 10
    precision: 2
    source_names:
      - 'Fine Knock Learn'
      - 'Fine Knock Learn (degrees)'
      - 'Fine Knock Learning'
      - 'FKL'

  - id: iam
    name: 'IAM'
    description: 'Ignition Advance Multiplier (Subaru learning value)'
    category: correction
    data_type: float
    unit: 'multiplier'
    min: 0
    max: 1
    precision: 3
    source_names:
      - 'IAM'
      - 'Ignition Advance Multiplier'

  - id: knock_retard
    name: 'Knock Retard'
    description: 'Timing retard from knock detection'
    category: correction
    data_type: float
    unit: 'degrees'
    source_names:
      - 'Knock Correction'


  # Diagnostics
  - id: idle_valve_step
    name: 'Idle Valve Step'
    description: 'Idle air control valve step position.'
    category: diagnostics
    data_type: float
    unit: 'count'
    source_names:
      - 'Idle Speed Control Valve Step'

  - id: roughness_cyl_1
    name: 'Roughness Monitor Cylinder 1'
    description: 'Combustion roughness for cylinder 1.'
    category: diagnostics
    data_type: float
    unit: 'count'
    source_names:
      - 'Roughness Monitor Cylinder #1'

  - id: roughness_cyl_2
    name: 'Roughness Monitor Cylinder 2'
    description: 'Combustion roughness for cylinder 2.'
    category: diagnostics
    data_type: float
    unit: 'count'
    source_names:
      - 'Roughness Monitor Cylinder #2'

  - id: roughness_cyl_3
    name: 'Roughness Monitor Cylinder 3'
    description: 'Combustion roughness for cylinder 3.'
    category: diagnostics
    data_type: float
    unit: 'count'
    source_names:
      - 'Roughness Monitor Cylinder #3'

  - id: roughness_cyl_4
    name: 'Roughness Monitor Cylinder 4'
    description: 'Combustion roughness for cylinder 4.'
    category: diagnostics
    data_type: float
    unit: 'count'
    source_names:
      - 'Roughness Monitor Cylinder #4'


  # Drivetrain
  - id: gear
    name: 'Gear Position'
    description: 'Current gear'
    category: drivetrain
    data_type: int
    unit: 'gear'
    min: 0
    max: 6
    precision: 0
    source_names:
      - 'Gear Position'
      - 'Gear'
      - 'Current Gear'


  # Electrical
  - id: ap_main_voltage
    name: 'Main Accelerator Sensor Voltage'
    description: 'Main accelerator pedal sensor voltage.'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Main Accelerator Sensor'

  - id: ap_sub_voltage
    name: 'Sub Accelerator Sensor Voltage'
    description: 'Secondary accelerator pedal sensor voltage.'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Sub Accelerator Sensor'

  - id: battery_voltage
    name: 'Battery Voltage'
    description: 'System voltage'
    category: electrical
    data_type: float
    unit: 'volts'
    min: 0
    max: 20
    precision: 2
    source_names:
      - 'Battery Voltage'
      - 'Battery Voltage (V)'
      - 'Battery'

  - id: fuel_level_voltage
    name: 'Fuel Level Voltage'
    description: 'Raw fuel level sender voltage.'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Fuel Level Voltage'

  - id: maf_voltage
    name: 'MAF Voltage'
    description: 'Mass airflow sensor voltage'
    category: electrical
    data_type: float
    unit: 'volts'
    min: 0
    max: 5
    precision: 2
    source_names:
      - 'Mass Airflow Sensor Voltage'
      - 'Mass Airflow Sensor Voltage (V)'
      - 'MAF Voltage'
      - 'Air Flow Sensor Voltage'

  - id: o2_sensor_current
    name: 'O2 Sensor Current'
    description: 'Wideband oxygen sensor pump current.'
    category: electrical
    data_type: float
    unit: 'ma'
    # ma -> amps (canonical)
    to_canonical:
      scale: 0.001
      offset: 0
    source_names:
      - 'Air/Fuel Sensor #1 Current'

  - id: o2_sensor_resistance
    name: 'O2 Sensor Resistance'
    description: 'Wideband oxygen sensor internal resistance.'
    category: electrical
    data_type: float
    unit: 'ohms'
    source_names:
      - 'Air/Fuel Sensor #1 Resistance'

  - id: o2_voltage_front_1
    name: 'Front O2 Voltage 1'
    description: 'Narrowband front oxygen sensor 1 voltage.'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Front O2 Sensor #1'

  - id: o2_voltage_front_2
    name: 'Front O2 Voltage 2'
    description: 'Narrowband front oxygen sensor 2 voltage.'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Front O2 Sensor #2'

  - id: o2_voltage_rear
    name: 'Rear O2 Voltage'
    description: 'Narrowband rear oxygen sensor voltage.'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Rear O2 Sensor'

  - id: ocv_current_exhaust
    name: 'Exhaust OCV Current'
    description: 'Exhaust oil control valve current.'
    category: electrical
    data_type: float
    unit: 'ma'
    # ma -> amps (canonical)
    to_canonical:
      scale: 0.001
      offset: 0
    source_names:
      - 'Exhaust OCV Current Left'

  - id: ocv_current_intake
    name: 'Intake OCV Current'
    description: 'Intake oil control valve current.'
    category: electrical
    data_type: float
    unit: 'ma'
    # ma -> amps (canonical)
    to_canonical:
      scale: 0.001
      offset: 0
    source_names:
      - 'Intake OCV Current Left'

  - id: tgv_voltage_left
    name: 'Tumble Valve Sensor Voltage Left'
    description: 'Left tumble generator valve position sensor voltage.'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Tumble Valve Position Sensor Left'

  - id: tgv_voltage_right
    name: 'Tumble Valve Sensor Voltage Right'
    description: 'Right tumble generator valve position sensor voltage.'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Tumble Valve Position Sensor Right'

  - id: throttle_motor_voltage
    name: 'Throttle Motor Voltage'
    description: 'Drive-by-wire throttle motor voltage.'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Throttle Motor Voltage'

  - id: tps_main_voltage
    name: 'Main Throttle Sensor Voltage'
    description: 'Main throttle position sensor voltage.'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Main Throttle Sensor'

  - id: tps_sub_voltage
    name: 'Sub Throttle Sensor Voltage'
    description: 'Secondary throttle position sensor voltage.'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Sub Throttle Sensor'

  - id: tps_voltage
    name: 'TPS Voltage'
    description: 'Raw throttle position sensor voltage'
    category: electrical
    data_type: float
    unit: 'volts'
    source_names:
      - 'Throttle Sensor Voltage'


  # Engine
  - id: af_lean_correction
