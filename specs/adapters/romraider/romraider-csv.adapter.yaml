  - id: wastegate_duty_primary
    name: 'Primary Wastegate Duty'
    description: 'Primary wastegate solenoid duty cycle.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Primary Wastegate Duty Cycle'

  - id: wastegate_duty_secondary
    name: 'Secondary Wastegate Duty'
    description: 'Secondary wastegate solenoid duty cycle.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Secondary Wastegate Duty Cycle'


  # Fuel
  - id: afr
    name: 'Air-Fuel Ratio'
    description: 'Measured AFR from O2 sensor'
    category: fuel
    data_type: float
    unit: 'afr'
    min: 10
    max: 20
    precision: 2
    source_names:
      - 'A/F Sensor #1'
      - 'A/F Sensor #1 (AFR)'
      - 'AFR'
      - 'Air/Fuel Ratio'
      - 'Wideband AFR'

  - id: afr_external
    name: 'PLX AFR'
    description: 'PLX wideband AFR sensor'
    category: fuel
    data_type: float
    unit: 'afr'
    min: 10
    max: 20
    precision: 2
    source_names:
      - 'PLX AFR'
      - 'PLX AFR (AFR)'
      - 'PLX Wideband'

  - id: duty_cycle
    name: 'Injector Duty Cycle'
    description: 'Injector duty cycle'
    category: fuel
    data_type: float
    unit: 'percent'
    min: 0
    max: 100
    precision: 1
    source_names:
      - 'Injector Duty Cycle'
      - 'Injector Duty Cycle (%)'
      - 'IDC'

  - id: lambda
    name: 'Lambda'
    description: 'Lambda value from wideband O2'
    category: fuel
    data_type: float
    unit: 'lambda'
    source_names:
      - 'Air/Fuel Sensor #1'

  - id: lambda_2
    name: 'Lambda 2'
    description: 'Lambda value from second wideband O2'
    category: fuel
    data_type: float
    unit: 'lambda'
    source_names:
      - 'Air/Fuel Sensor #2'

  - id: pulse_width
    name: 'Injector Pulse Width'
    description: 'Injector pulse width'
    category: fuel
    data_type: float
    unit: 'milliseconds'
    source_names:
      - 'Fuel Injector #1 Pulse Width'

  - id: pulse_width_2
    name: 'Pulse Width 2'
    description: 'Injector pulse width for stage or bank 2.'
    category: fuel
    data_type: float
    unit: 'milliseconds'
    source_names:
      - 'Fuel Injector #2 Pulse Width'


  # Ignition
  - id: ignition_advance
    name: 'Ignition Advance'
    description: 'Spark timing advance'
    category: ignition
    data_type: float
    unit: 'degrees'
    min: -20
    max: 60
    precision: 1
    source_names:
      - 'Ignition Timing'
      - 'Ignition Timing (degrees)'
      - 'Timing Advance'
      - 'Timing Advance (degrees)'
      - 'Spark Advance'

  - id: ignition_timing_learned
    name: 'Learned Ignition Timing'
    description: 'Learned ignition timing correction.'
    category: ignition
    data_type: float
    unit: 'degrees'
    source_names:
      - 'Learned Ignition Timing'


  # Pressure
  - id: barometric_pressure
    name: 'Barometric Pressure'
    description: 'Atmospheric pressure'
    category: pressure
    data_type: float
    unit: 'psi'
    # psi -> kpa (canonical)
    to_canonical:
      scale: 6.89475729
      offset: 0
    source_names:
      - 'Atmospheric Pressure'

  - id: boost
    name: 'Boost Pressure'
    description: 'Boost pressure (gauge)'
    category: pressure
    data_type: float
    unit: 'psi'
    # psi -> kpa (canonical)
    to_canonical:
      scale: 6.89475729
      offset: 0
    min: -15
    max: 30
    precision: 2
    source_names:
      - 'Boost'
      - 'Boost (psi)'
      - 'Boost Pressure'

  - id: boost_external
    name: 'PLX Boost'
    description: 'PLX boost/vacuum sensor'
    category: pressure
    data_type: float
    unit: 'bar'
    min: -1
    max: 3
    precision: 2
    source_names:
      - 'PLX Manifold Absolute Pressure'
      - 'PLX Manifold Absolute Pressure (bar)'
      - 'PLX Boost'

  - id: boost_target
    name: 'Boost Target'
    description: 'Target boost from boost control'
    category: pressure
    data_type: float
    unit: 'psi'
    # psi -> kpa (canonical)
    to_canonical:
      scale: 6.89475729
      offset: 0
    min: 0
    max: 30
    precision: 2
    source_names:
      - 'Target Boost'
      - 'Target Boost (psi)'
      - 'Boost Target'

  - id: brake_booster_pressure
    name: 'Brake Booster Pressure'
    description: 'Vacuum pressure in the brake booster.'
    category: pressure
    data_type: float
    unit: 'psi'
    # psi -> kpa (canonical)
    to_canonical:
      scale: 6.89475729
      offset: 0
    source_names:
      - 'Brake Booster Pressure'

  - id: fuel_pressure_high
    name: 'High Fuel Pressure'
    description: 'Direct-injection high-pressure rail pressure.'
    category: pressure
    data_type: float
    unit: 'mpa'
    # mpa -> bar (canonical)
    to_canonical:
      scale: 10
      offset: 0
    source_names:
      - 'Fuel Pressure (High)'

  - id: fuel_tank_pressure
    name: 'Fuel Tank Pressure'
    description: 'Evaporative system fuel tank pressure.'
    category: pressure
    data_type: float
    unit: 'psi'
    # psi -> kpa (canonical)
    to_canonical:
      scale: 6.89475729
      offset: 0
    source_names:
      - 'Fuel Tank Pressure'

  - id: manifold_relative_pressure
    name: 'Manifold Relative Pressure'
    description: 'Manifold pressure relative to atmosphere.'
    category: pressure
    data_type: float
    unit: 'psi'
    # psi -> kpa (canonical)
    to_canonical:
      scale: 6.89475729
      offset: 0
    source_names:
      - 'Manifold Relative Pressure'

  - id: map
    name: 'Manifold Pressure'
    description: 'Manifold absolute pressure'
    category: pressure
    data_type: float
    unit: 'psi'
    # psi -> kpa (canonical)
    to_canonical:
      scale: 6.89475729
      offset: 0
    min: -15
    max: 30
    precision: 2
    source_names:
      - 'Manifold Relative Pressure'
      - 'Manifold Relative Pressure (psi)'
      - 'Manifold Absolute Pressure'
      - 'MAP'
      - 'MAP (psi)'


  # Speed
  - id: cruise_target_speed
    name: 'Cruise Target Speed'
    description: 'Cruise control target speed.'
    category: speed
    data_type: float
    unit: 'kph'
    source_names:
