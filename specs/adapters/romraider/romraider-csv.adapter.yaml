    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Air/Fuel Correction #2'

  - id: afr_correction_3
    name: 'A/F Correction 3'
    description: 'Short-term fuel trim, zone 3.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Air/Fuel Correction #3'

  - id: alternator_duty
    name: 'Alternator Duty'
    description: 'Alternator field duty cycle.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Alternator Duty'

  - id: dbw_duty_cycle
    name: 'Throttle Motor Duty'
    description: 'Drive-by-wire throttle motor duty cycle.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Throttle Motor Duty'

  - id: engine_load_mass
    name: 'Engine Load (Mass)'
    description: 'Engine load expressed as air mass per intake event.'
    category: engine
    data_type: float
    unit: 'g/s'
    source_names:
      - 'Engine Load'
      - 'Engine Load (RAM)'

  - id: fuel_pump_duty
    name: 'Fuel Pump Duty'
    description: 'Primary fuel pump duty cycle.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Fuel Pump Duty'

  - id: idle_valve
    name: 'Idle Valve Position'
    description: 'Idle air control valve position'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Idle Speed Control Valve Duty Ratio'

  - id: load
    name: 'Engine Load'
    description: 'Calculated engine load'
    category: engine
    data_type: float
    unit: 'percent'
    min: 0
    max: 200
    precision: 1
    source_names:
      - 'Engine Load'
      - 'Engine Load (%)'
      - 'Load'
      - 'Calculated Load'
      - 'Engine Load (Relative) (%)'

  - id: maf
    name: 'Mass Airflow'
    description: 'Mass airflow sensor reading'
    category: engine
    data_type: float
    unit: 'g/s'
    min: 0
    max: 500
    precision: 1
    source_names:
      - 'Mass Airflow'
      - 'Mass Airflow (g/s)'
      - 'MAF'
      - 'MAF (g/s)'
      - 'Mass Air Flow'

  - id: o2_heater_duty
    name: 'O2 Heater Duty'
    description: 'Wideband oxygen sensor heater duty cycle.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Air/Fuel Heater Duty'

  - id: pedal_position
    name: 'Accelerator Pedal'
    description: 'Accelerator pedal position'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Accelerator Opening Angle'

  - id: purge_valve_duty
    name: 'Purge Valve Duty'
    description: 'Evaporative canister purge valve duty cycle.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'CPC Valve Duty Ratio'

  - id: rpm
    name: 'Engine RPM'
    description: 'Engine speed'
    category: engine
    data_type: float
    unit: 'rpm'
    min: 0
    max: 9000
    precision: 0
    source_names:
      - 'Engine Speed'
      - 'Engine Speed (rpm)'
      - 'RPM'
      - 'RPM (rpm)'

  - id: tps
    name: 'Throttle Position'
    description: 'Throttle position sensor'
    category: engine
    data_type: float
    unit: 'percent'
    min: 0
    max: 100
    precision: 1
    source_names:
      - 'Throttle Opening Angle'
      - 'Throttle Opening Angle (%)'
      - 'Throttle Position'
      - 'TPS'
      - 'TPS (%)'

  - id: vvt_exhaust
    name: 'VVT Exhaust Position'
    description: 'Variable valve timing exhaust cam position'
    category: engine
    data_type: float
    unit: 'degrees'
    source_names:
      - 'Exhaust VVT Advance Angle Left'

  - id: vvt_exhaust_bank2_actual
    name: 'VVT Exhaust Bank 2 Actual'
    description: 'Measured exhaust cam position, bank 2.'
    category: engine
    data_type: float
    unit: 'degrees'
    source_names:
      - 'Exhaust VVT Advance Angle Right'

  - id: vvt_exhaust_bank2_duty
    name: 'VVT Exhaust Bank 2 Duty'
    description: 'Exhaust cam solenoid duty cycle, bank 2.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Exhaust OCV Duty Right'

  - id: vvt_exhaust_duty
    name: 'VVT Exhaust Duty'
    description: 'Exhaust cam solenoid duty cycle.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Exhaust OCV Duty Left'

  - id: vvt_intake
    name: 'VVT Intake Position'
    description: 'Variable valve timing intake cam position'
    category: engine
    data_type: float
    unit: 'degrees'
    source_names:
      - 'Intake VVT Advance Angle Left'

  - id: vvt_intake_bank2_actual
    name: 'VVT Intake Bank 2 Actual'
    description: 'Measured intake cam position, bank 2.'
    category: engine
    data_type: float
    unit: 'degrees'
    source_names:
      - 'Intake VVT Advance Angle Right'

  - id: vvt_intake_bank2_duty
    name: 'VVT Intake Bank 2 Duty'
    description: 'Intake cam solenoid duty cycle, bank 2.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Intake OCV Duty Right'

  - id: vvt_intake_duty
    name: 'VVT Intake Duty'
    description: 'Intake cam solenoid duty cycle.'
    category: engine
    data_type: float
    unit: 'percent'
    source_names:
      - 'Intake OCV Duty Left'

  - id: wastegate_duty
    name: 'Wastegate Duty Cycle'
    description: 'Wastegate solenoid duty cycle'
    category: engine
    data_type: float
    unit: 'percent'
    min: 0
    max: 100
    precision: 1
    source_names:
      - 'Wastegate Duty'
      - 'Wastegate Duty (%)'
