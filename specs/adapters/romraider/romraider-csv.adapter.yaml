metadata:
  author: 'OpenECU Alliance'
  license: 'MIT'
  tested_with:
    - 'Subaru WRX/STI (2002-2021)'
    - 'Subaru Legacy GT'
    - 'Subaru Forester XT'
  known_issues:
    - 'Vehicle speed is declared in kph, matching RomRaider''s own metric. Logs
      exported with the mph convert factor applied carry the same column name
      with an (mph) suffix — check the header before trusting the unit.'
    - 'European locale files use semicolon delimiter and comma decimal separator'
    - 'Units in header may vary based on RomRaider settings'
    - 'PLX sensor channels require PLX iMFD connected'
  changelog:
    - version: '1.2.0'
      date: '2026-08-24'
      changes:
        - 'Rebuild the channel list from definitions/log_defs.xml in RomRaider@master,
          whose parameter ids are the CSV column headers. 27 channels -> 95.'
        - 'Adds the full Subaru VVT and OCV set for both banks, per-cylinder roughness
          monitors, the wideband current/resistance/heater channels, primary and
          secondary wastegate duty, high fuel pressure, tumble valve sensors and the
          meaningful relay and switch signals.'
        - 'Correct vehicle_speed to kph. RomRaider declares metric="KPH" and supplies a
          separate km/h-to-mph convert factor, so mph was the converted display and not
          the base unit.'
        - 'Separate the PLX external-gauge channels from the ECU own channels:
          afr_external, boost_external and egt_external. They are distinct columns in
          the same log and must not be conflated with afr, boost and egt_1.'
        - 'Remove "Fuel Injector #1 Pulse Width (ms)" from the source names of
          duty_cycle. A pulse width in milliseconds is not a duty cycle; it now maps to
          the pulse_width channel.'
    - version: '1.1.0'
      date: '2026-08-24'
      changes:
        - 'Add conversions to canonical for map, boost, target_boost and plx_boost (->
          kpa), vehicle_speed (-> kph) and time (-> seconds). This adapter was the
          largest single source of unit drift.'
        - 'Declare ''to_canonical'' scale/offset on channels whose log unit differs from
          the canonical unit in specs/channels.yaml. The log unit is unchanged — it
          still describes the file — but a consumer can now normalise without knowing
          the vendor.'
    - version: '1.0.0'
      date: '2025-01-04'
      changes:
        - 'Initial release'
        - 'Support for Subaru-specific knock learning parameters'
        - 'Support for PLX external sensors'

# RomRaider-specific extensions
x_romraider:
  european_locale_support: true
  units_in_parentheses: true
  subaru_specific_channels: ['iam', 'dam', 'fine_knock_learning', 'feedback_knock']
