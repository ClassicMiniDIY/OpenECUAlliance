metadata:
  author: 'OpenECU Alliance'
  license: 'MIT'
  tested_with:
    - 'rusEFI firmware 2024.xx'
    - 'rusEFI firmware 2025.xx'
  known_issues:
    - 'Timestamp wraps at ~65.5 seconds'
    - 'Channel names/units defined in firmware build'
    - 'Format version 2 has extended field definitions'
  changelog:
    - version: '2.1.0'
      date: '2026-08-24'
      changes:
        - 'Rebuild the channel list from rusEFI LiveData.yaml and its 40 live-data
          structures in rusefi/rusefi@master. 46 channels -> 133.'
        - 'Adds the knock controller, boost control, electronic throttle, idle state,
          VVT for both banks, wideband state, long- and short-term fuel trim, anti-lag,
          misfire detection, per-cylinder knock and all eight EGT channels.'
        - 'Deliberately excluded under the curated-coverage rule: raw ADC voltages, Lua
          script timers, misfire thresholds, GDI and TCU internals, CRC and padding
          fields, and duplicate estimates of a channel already present.'
        - 'Existing source_names are preserved and merged with the vendor field names.'
    - version: '2.0.0'
      date: '2026-08-24'
      changes:
        - 'BREAKING: rename fuel_flow to fuel_flow_mass. rusEFI reports mass flow in
          g/s; canonical fuel_flow is volumetric l/h and the two are not convertible
          without fuel density.'
        - 'Move boost_duty to the ''pressure'' category to match the registry.'
    - version: '1.0.0'
      date: '2025-01-04'
      changes:
        - 'Initial release'
        - 'Core rusEFI channels including ETB and VVT'

# rusEFI-specific extensions
x_rusefi:
  mlg_version: [1, 2]
  field_definition_size_v1: 55
  field_definition_size_v2: 89
  value_formula: '(raw + transform) * scale'
  firmware_config_reference: 'https://github.com/rusefi/rusefi/tree/master/firmware'
