# OpenECU Alliance Adapter Specification
# rusEFI MegaLogViewer (.mlg) Binary Format

openecualliance: '1.0'
id: rusefi-mlg
name: 'rusEFI MLG Binary'
version: '2.1.0'
vendor: rusefi
description: |
  Binary log files from rusEFI open-source ECU in MegaLogViewer format.

  Format characteristics:
  - Binary format with "MLVLG" magic header (shared with Speeduino/TunerStudio)
  - Self-describing: channel definitions embedded in file
  - Each channel has name, unit, scale, and transform
  - Values: (raw_value + transform) * scale
  - Big-endian byte order
  - Format version 2 uses 89-byte field definitions
  - Timestamp wraps at 65535ms (~65.5 seconds)
website: 'https://rusefi.com'
branding:
  logo: rusefi-logo.png
  icon: rusefi-icon.png
  banner: rusefi-banner.png
  color_primary: '#B7410E'
  color_secondary: '#2C2C2C'

file_format:
  type: binary
  extensions: ['.mlg']
  endianness: big
  magic_bytes: [0x4D, 0x4C, 0x56, 0x4C, 0x47] # "MLVLG"
  specification_url: 'https://github.com/rusefi/rusefi'

channels:

  # Acceleration
  - id: g_lateral
    name: 'Lateral G'
    description: 'Lateral acceleration (positive = right)'
    category: acceleration
    data_type: float
    unit: 'g'
    source_names:
      - 'accelerationLat'

  - id: g_longitudinal
    name: 'Longitudinal G'
    description: 'Longitudinal acceleration (positive = acceleration)'
    category: acceleration
    data_type: float
    unit: 'g'
    source_names:
      - 'accelerationLon'

  - id: g_vertical
    name: 'Vertical G'
    description: 'Vertical acceleration'
    category: acceleration
    data_type: float
    unit: 'g'
    source_names:
      - 'accelerationVert'

  - id: vehicle_acceleration
    name: 'Vehicle Acceleration'
    description: 'Longitudinal acceleration derived from vehicle speed.'
    category: acceleration
    data_type: float
    unit: 'm/s2'
    source_names:
      - 'VssAcceleration'
      - 'Vss Accel'


  # Correction
  - id: accel_enrichment
    name: 'Acceleration Enrichment'
    description: 'Transient fuel enrichment'
    category: correction
    data_type: float
    unit: 'percent'
    source_names:
      - 'tpsAccelFuel'

  - id: barometric_correction
    name: 'Barometric Correction'
    description: 'Altitude/barometric fuel correction'
    category: correction
    data_type: float
    unit: 'percent'
    min: -50
    max: 50
    precision: 1
