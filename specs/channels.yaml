# OpenECU Alliance — Canonical Channel Registry
#
# The machine-readable source of truth for canonical channel IDs. Human-readable
# form: SPECIFICATION.md (generated from this file — edit here, not there).
#
# CONTRACT
#   - An adapter channel's 'id' MUST appear here (as an id or an alias).
#   - 'unit' here is the CANONICAL unit for the quantity.
#   - An adapter's own 'unit' stays truthful to what the log file contains. When
#     it differs from the canonical unit, the channel MUST carry 'to_canonical'
#     with scale/offset: canonical = raw * scale + offset.
#   - Protocol signals MUST carry 'id' and 'category' drawn from this registry.
#
# Validate with: bun scripts/validate-specs.ts

openecualliance: '1.0'
version: '1.0.0'
updated: '2026-08-24'

