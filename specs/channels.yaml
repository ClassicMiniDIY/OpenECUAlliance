# Recognised unit spellings that normalise with no numeric change.
unit_spellings:
  '%': 'percent'
  'c': 'celsius'
  'deg': 'degrees'
  'deg/sec': 'deg/s'
  'kPa': 'kpa'
  'km/h': 'kph'
  'ms': 'milliseconds'
  'pct': 'percent'
  's': 'seconds'
  'v': 'volts'
  '°c': 'celsius'

# Unit conversions to canonical. canonical = raw * scale + offset.
conversions:
  - from: 'psi'
    to: 'kpa'
    scale: 6.89475729
    offset: 0
  - from: 'bar'
    to: 'kpa'
    scale: 100
    offset: 0
  - from: 'mbar'
    to: 'kpa'
    scale: 0.1
    offset: 0
  - from: 'mph'
    to: 'kph'
    scale: 1.609344
    offset: 0
  - from: 'milliseconds'
    to: 'seconds'
    scale: 0.001
    offset: 0
  - from: 'cc/min'
    to: 'l/h'
    scale: 0.06
    offset: 0
  - from: 'fahrenheit'
    to: 'celsius'
    scale: 0.5555555556
    offset: -17.7777778
