# OpenECU Alliance Protocol Definition
# Syvecs S6/S7 ECU CAN Broadcast Protocol
#
# Based on Syvecs fixed datastream protocol documentation.
# Compatible with S6, S6+, S7, S7-I, S7Plus ECUs.
#
# IMPORTANT NOTES:
# - Default CAN ID range starts at 0x600 (configurable in ECU)
# - Protocol uses little-endian byte order
# - 1Mbit/s baudrate (configurable)
# - Not all channels broadcast unless configured in ECU

openecualliance: '1.0'
type: protocol

id: syvecs-s7-broadcast
name: 'Syvecs S7 CAN Broadcast Protocol'
version: '1.1.0'
vendor: syvecs
description: |
  CAN broadcast protocol for Syvecs S6/S7 series ECUs including S6, S6+, S7,
  S7-I, and S7Plus. This protocol outputs real-time engine data for integration
  with data loggers, dashboards, and other CAN-enabled devices.

  Protocol uses 11-bit identifiers at 1Mb/second with little-endian encoding.
  The base CAN ID is configurable in the ECU (default 0x600).
  Temperature values are transmitted in Celsius with offset.
  Pressure values are in kPa absolute or bar depending on signal.

website: 'https://www.syvecs.com'

branding:
  logo: syvecs-logo.png
  icon: syvecs-icon.png
  color_primary: '#6600CC'
  color_secondary: '#1A1A1A'

protocol:
  type: can
  baudrate: 1000000
  extended_id: false

messages:
  # ============================================================================
  # FRAME 1 (0x600) - Core Engine Data
  # ============================================================================

  - id: 0x600
    name: 'Engine Data 1'
    description: 'RPM, throttle position, manifold pressure, battery voltage'
    length: 8
    interval_ms: 10
    transmitter: ECU
    signals:
      - name: 'RPM'
        id: rpm
        category: engine
        description: 'Engine rotational speed'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: 'rpm'
        min: 0
        max: 65535

      - name: 'Throttle_Position'
        id: tps
        category: engine
        description: 'Throttle position sensor'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'
        min: 0
        max: 100

      - name: 'Manifold_Pressure'
        id: map
        category: pressure
        description: 'Manifold absolute pressure'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'kPa'
        min: 0
        max: 6553.5

      - name: 'Battery_Voltage'
        id: battery_voltage
        category: electrical
        description: 'System battery voltage'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.01
        offset: 0
        unit: 'V'
        min: 0
        max: 25.5

  # ============================================================================
  # FRAME 2 (0x601) - Temperatures
  # ============================================================================

  - id: 0x601
    name: 'Temperature Data'
    description: 'Coolant temperature, air temperature, oil temperature, fuel temperature'
    length: 8
    interval_ms: 100
    transmitter: ECU
    signals:
      - name: 'Coolant_Temperature'
        id: coolant_temp
        category: temperature
        description: 'Engine coolant temperature'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: -40
        max: 200
        comment: 'Temperature in degrees Celsius'

      - name: 'Air_Temperature'
        id: iat
        category: temperature
        description: 'Intake air temperature'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: -40
        max: 200

      - name: 'Oil_Temperature'
        id: oil_temp
        category: temperature
        description: 'Engine oil temperature'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: -40
        max: 200

      - name: 'Fuel_Temperature'
        id: fuel_temp
        category: temperature
        description: 'Fuel temperature'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: -40
        max: 200

  # ============================================================================
  # FRAME 3 (0x602) - Fuel and Lambda
  # ============================================================================

  - id: 0x602
    name: 'Fuel and Lambda'
    description: 'Lambda, target lambda, fuel pressure, injection timing'
    length: 8
    interval_ms: 20
    transmitter: ECU
    signals:
      - name: 'Lambda'
        id: lambda
        category: fuel
        description: 'Wideband lambda sensor reading'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.001
        offset: 0
        unit: 'lambda'
        min: 0.5
        max: 2.0

      - name: 'Target_Lambda'
        id: lambda_target
        category: fuel
        description: 'Target lambda value'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.001
        offset: 0
        unit: 'lambda'
        min: 0.5
        max: 2.0

      - name: 'Fuel_Pressure'
        id: fuel_pressure
        category: pressure
        description: 'Fuel rail pressure'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'bar'
        min: 0
        max: 1000

      - name: 'Injection_Timing'
        vendor_specific: true
        description: 'Injection timing angle'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'deg'

  # ============================================================================
  # FRAME 4 (0x603) - Ignition and Injection
  # ============================================================================

  - id: 0x603
    name: 'Ignition and Injection'
    description: 'Ignition timing, injector duty cycle, injector pulse width'
    length: 8
    interval_ms: 20
    transmitter: ECU
    signals:
      - name: 'Ignition_Angle'
        id: ignition_advance
        category: ignition
        description: 'Ignition timing advance'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'deg'
        min: -30
        max: 60

      - name: 'Injector_Duty_Cycle'
        id: duty_cycle
        category: fuel
        description: 'Primary injector duty cycle'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'
        min: 0
        max: 100

      - name: 'Injector_Pulse_Width'
        id: pulse_width
        category: fuel
        description: 'Injector pulse width'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.001
        offset: 0
        unit: 'ms'
        min: 0
        max: 65.535

      - name: 'Injector_Duty_Cycle_2'
        id: injector_duty_2
        category: engine
        description: 'Secondary injector duty cycle'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'
        min: 0
        max: 100

  # ============================================================================
  # FRAME 5 (0x604) - Boost Control
  # ============================================================================

  - id: 0x604
    name: 'Boost Control'
    description: 'Boost target, boost duty, wastegate position, boost error'
    length: 8
    interval_ms: 20
    transmitter: ECU
    signals:
      - name: 'Boost_Target'
        id: boost_target
        category: pressure
        description: 'Target boost pressure'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'kPa'

      - name: 'Boost_Duty'
        id: boost_duty
        category: pressure
        description: 'Boost control solenoid duty cycle'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'
        min: 0
        max: 100

      - name: 'Wastegate_Position'
        id: wastegate_position
        category: engine
        description: 'Wastegate position feedback'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'
        min: 0
        max: 100

      - name: 'Boost_Error'
        id: boost_error
        category: pressure
        description: 'Boost control error'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'kPa'

  # ============================================================================
  # FRAME 6 (0x605) - Pressures
  # ============================================================================

  - id: 0x605
    name: 'Pressure Data'
    description: 'Oil pressure, exhaust back pressure, barometric pressure'
    length: 8
    interval_ms: 50
    transmitter: ECU
    signals:
      - name: 'Oil_Pressure'
        id: oil_pressure
        category: pressure
        description: 'Engine oil pressure'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'bar'
        min: 0
        max: 20

      - name: 'Exhaust_Back_Pressure'
        vendor_specific: true
        description: 'Exhaust manifold back pressure'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'bar'
        min: 0
        max: 10

      - name: 'Barometric_Pressure'
        id: barometric_pressure
        category: pressure
        description: 'Atmospheric pressure'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'kPa'
        min: 80
        max: 110

      - name: 'Differential_Pressure'
        vendor_specific: true
        description: 'Fuel pressure differential'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'bar'

  # ============================================================================
  # FRAME 7 (0x606) - Vehicle Speed and Wheel Speeds
  # ============================================================================

  - id: 0x606
    name: 'Vehicle and Wheel Speeds'
    description: 'Vehicle speed and individual wheel speeds'
    length: 8
    interval_ms: 20
    transmitter: ECU
    signals:
      - name: 'Vehicle_Speed'
        id: vehicle_speed
        category: speed
        description: 'Vehicle speed'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'km/h'
        min: 0
        max: 400

      - name: 'Wheel_Speed_FL'
        id: wheel_speed_fl
        category: speed
        description: 'Front left wheel speed'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'km/h'
        min: 0
        max: 400

      - name: 'Wheel_Speed_FR'
        id: wheel_speed_fr
        category: speed
        description: 'Front right wheel speed'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'km/h'
        min: 0
        max: 400

      - name: 'Wheel_Speed_RL'
        id: wheel_speed_rl
        category: speed
        description: 'Rear left wheel speed'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'km/h'
        min: 0
        max: 400

  # ============================================================================
  # FRAME 8 (0x607) - Additional Wheel Speed and Gear
  # ============================================================================

  - id: 0x607
    name: 'Wheel Speed and Gear'
    description: 'Rear right wheel speed, gear position, wheel slip'
    length: 8
    interval_ms: 20
    transmitter: ECU
    signals:
      - name: 'Wheel_Speed_RR'
        id: wheel_speed_rr
        category: speed
        description: 'Rear right wheel speed'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'km/h'
        min: 0
        max: 400

      - name: 'Gear'
        id: gear
        category: drivetrain
        description: 'Current gear position'
        start_bit: 16
        length: 8
        byte_order: little_endian
        data_type: signed
        scale: 1.0
        offset: 0
        unit: ''
        comment: '0=Neutral, -1=Reverse, 1-8=Gears'

      - name: 'Wheel_Slip'
        id: traction_slip
        category: traction
        description: 'Wheel slip percentage'
        start_bit: 24
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'Launch_Control_State'
        vendor_specific: true
        description: 'Launch control active state'
        start_bit: 40
        length: 8
        byte_order: little_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: ''
        comment: '0=Off, 1=Armed, 2=Active'

      - name: 'Traction_Control_State'
        vendor_specific: true
        description: 'Traction control state'
        start_bit: 48
        length: 8
        byte_order: little_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: ''
        comment: '0=Off, 1=Active, 2=Cut'

      - name: 'Flat_Shift_State'
        vendor_specific: true
        description: 'Flat shift active state'
        start_bit: 56
        length: 8
        byte_order: little_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: ''
        comment: '0=Off, 1=Active'

  # ============================================================================
  # FRAME 9 (0x608) - EGT Sensors 1-4
  # ============================================================================

  - id: 0x608
    name: 'EGT Sensors 1-4'
    description: 'Exhaust gas temperatures cylinders 1-4'
    length: 8
    interval_ms: 100
    transmitter: ECU
    signals:
      - name: 'EGT_1'
        id: egt_1
        category: temperature
        description: 'EGT cylinder 1'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: 0
        max: 1200

      - name: 'EGT_2'
        id: egt_2
        category: temperature
        description: 'EGT cylinder 2'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: 0
        max: 1200

      - name: 'EGT_3'
        id: egt_3
        category: temperature
        description: 'EGT cylinder 3'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: 0
        max: 1200

      - name: 'EGT_4'
        id: egt_4
        category: temperature
        description: 'EGT cylinder 4'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: 0
        max: 1200

  # ============================================================================
  # FRAME 10 (0x609) - EGT Sensors 5-8
  # ============================================================================

  - id: 0x609
    name: 'EGT Sensors 5-8'
    description: 'Exhaust gas temperatures cylinders 5-8'
    length: 8
    interval_ms: 100
    transmitter: ECU
    signals:
      - name: 'EGT_5'
        id: egt_5
        category: temperature
        description: 'EGT cylinder 5'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: 0
        max: 1200

      - name: 'EGT_6'
        id: egt_6
        category: temperature
        description: 'EGT cylinder 6'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: 0
        max: 1200

      - name: 'EGT_7'
        id: egt_7
        category: temperature
        description: 'EGT cylinder 7'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: 0
        max: 1200

      - name: 'EGT_8'
        id: egt_8
        category: temperature
        description: 'EGT cylinder 8'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'degC'
        min: 0
        max: 1200

  # ============================================================================
  # FRAME 11 (0x60A) - Knock Control
  # ============================================================================

  - id: 0x60A
    name: 'Knock Control'
    description: 'Knock sensor levels and retard values'
    length: 8
    interval_ms: 20
    transmitter: ECU
    signals:
      - name: 'Knock_Level_1'
        id: knock_level_1
        category: ignition
        description: 'Knock sensor 1 level'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.01
        offset: 0
        unit: ''

      - name: 'Knock_Level_2'
        id: knock_level_2
        category: ignition
        description: 'Knock sensor 2 level'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.01
        offset: 0
        unit: ''

      - name: 'Knock_Retard'
        id: knock_retard
        category: correction
        description: 'Total knock retard applied'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'deg'

      - name: 'Knock_Threshold'
        vendor_specific: true
        description: 'Current knock threshold'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.01
        offset: 0
        unit: ''

  # ============================================================================
  # FRAME 12 (0x60B) - Lambda Bank 2 and Trim
  # ============================================================================

  - id: 0x60B
    name: 'Lambda Bank 2'
    description: 'Second lambda sensor and fuel trim data'
    length: 8
    interval_ms: 50
    transmitter: ECU
    signals:
      - name: 'Lambda_2'
        id: lambda_2
        category: fuel
        description: 'Wideband lambda sensor 2'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.001
        offset: 0
        unit: 'lambda'

      - name: 'Fuel_Trim_Bank_1'
        id: fuel_trim_bank_1
        category: engine
        description: 'Fuel trim bank 1'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'Fuel_Trim_Bank_2'
        id: fuel_trim_bank_2
        category: engine
        description: 'Fuel trim bank 2'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'Closed_Loop_Status'
        id: closed_loop_active
        category: status
        description: 'Closed loop fueling status'
        start_bit: 48
        length: 8
        byte_order: little_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: ''
        comment: '0=Open Loop, 1=Closed Loop'

      - name: 'Ethanol_Content'
        id: flex_ethanol
        category: fuel
        description: 'Ethanol fuel content'
        start_bit: 56
        length: 8
        byte_order: little_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: '%'

  # ============================================================================
  # FRAME 13 (0x60C) - Cam Angles
  # ============================================================================

  - id: 0x60C
    name: 'Cam Angles'
    description: 'Variable valve timing cam angles'
    length: 8
    interval_ms: 50
    transmitter: ECU
    signals:
      - name: 'Intake_Cam_Angle_1'
        id: vvt_intake
        category: engine
        description: 'Intake cam angle bank 1'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'deg'

      - name: 'Exhaust_Cam_Angle_1'
        id: vvt_exhaust
        category: engine
        description: 'Exhaust cam angle bank 1'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'deg'

      - name: 'Intake_Cam_Angle_2'
        id: vvt_intake_bank2_actual
        category: engine
        description: 'Intake cam angle bank 2'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'deg'

      - name: 'Exhaust_Cam_Angle_2'
        id: vvt_exhaust_bank2_actual
        category: engine
        description: 'Exhaust cam angle bank 2'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'deg'

  # ============================================================================
  # FRAME 14 (0x60D) - Drive-By-Wire Throttle
  # ============================================================================

  - id: 0x60D
    name: 'Drive By Wire'
    description: 'DBW throttle data and accelerator pedal'
    length: 8
    interval_ms: 10
    transmitter: ECU
    signals:
      - name: 'Accelerator_Pedal_Position'
        id: pedal_position
        category: engine
        description: 'Accelerator pedal position'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'DBW_Throttle_Target'
        id: etb_target
        category: engine
        description: 'DBW throttle target position'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'DBW_Throttle_Position'
        id: etb_position
        category: engine
        description: 'DBW throttle actual position'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'DBW_Throttle_Error'
        id: etb_error
        category: engine
        description: 'DBW throttle position error'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: '%'

  # ============================================================================
  # FRAME 15 (0x60E) - Engine Status Flags
  # ============================================================================

  - id: 0x60E
    name: 'Engine Status'
    description: 'Engine status flags and limiters'
    length: 8
    interval_ms: 50
    transmitter: ECU
    signals:
      - name: 'Engine_State'
        vendor_specific: true
        description: 'Current engine state'
        start_bit: 0
        length: 8
        byte_order: little_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: ''
        comment: '0=Off, 1=Cranking, 2=Running, 3=Stalled'

      - name: 'Rev_Limiter_Active'
        id: rev_limiter_active
        category: status
        description: 'Rev limiter active flag'
        start_bit: 8
        length: 8
        byte_order: little_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: ''
        comment: '0=Off, 1=Soft Limit, 2=Hard Limit'

      - name: 'RPM_Limit'
        id: rev_limit_rpm
