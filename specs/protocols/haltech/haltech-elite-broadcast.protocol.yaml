      - name: 'EGT_Sensor_5'
        id: egt_5
        category: temperature
        description: 'EGT sensor 5'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'EGT_Sensor_6'
        id: egt_6
        category: temperature
        description: 'EGT sensor 6'
        start_bit: 16
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'EGT_Sensor_7'
        id: egt_7
        category: temperature
        description: 'EGT sensor 7'
        start_bit: 32
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'EGT_Sensor_8'
        id: egt_8
        category: temperature
        description: 'EGT sensor 8'
        start_bit: 48
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

  # 0x375 - EGT Sensors 9-12 (10Hz)
  - id: 0x375
    name: 'EGT Sensors 9-12'
    description: 'Exhaust gas temperatures 9-12'
    length: 8
    interval_ms: 100
    transmitter: ECU
    signals:
      - name: 'EGT_Sensor_9'
        id: egt_9
        category: temperature
        description: 'EGT sensor 9'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'EGT_Sensor_10'
        id: egt_10
        category: temperature
        description: 'EGT sensor 10'
        start_bit: 16
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'EGT_Sensor_11'
        id: egt_11
        category: temperature
        description: 'EGT sensor 11'
        start_bit: 32
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'EGT_Sensor_12'
        id: egt_12
        category: temperature
        description: 'EGT sensor 12'
        start_bit: 48
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

  # 0x376 - Ambient Conditions (10Hz)
  - id: 0x376
    name: 'Ambient Conditions'
    description: 'Ambient temperature and humidity data'
    length: 8
    interval_ms: 100
    transmitter: ECU
    signals:
      - name: 'Ambient_Air_Temperature'
        id: ambient_temp
        category: temperature
        description: 'Ambient air temperature'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'Relative_Humidity'
        id: humidity
        category: fuel
        description: 'Relative humidity'
        start_bit: 16
        length: 16
        byte_order: big_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'Specific_Humidity'
        id: humidity
        category: fuel
        description: 'Specific humidity'
        start_bit: 32
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 100.0
        offset: 0
        unit: 'ppm'
        comment: 'y = x*100'

      - name: 'Absolute_Humidity'
        id: humidity
        category: fuel
        description: 'Absolute humidity'
        start_bit: 48
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'g/m3'

  # 0x473 - Total Fuel and Switches (10Hz)
  - id: 0x473
    name: 'Total Fuel and Switches'
    description: 'Total fuel used and various switch states'
    length: 8
    interval_ms: 100
    transmitter: ECU
    signals:
      - name: 'Total_Fuel_Used'
        id: fuel_used
        category: fuel
        description: 'Total fuel consumed'
        start_bit: 0
        length: 32
        byte_order: big_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: 'cc'

  # 0x477 - Engine Limiter (10Hz)
  - id: 0x477
    name: 'Engine Limiter'
    description: 'Engine limiter status and settings'
    length: 8
    interval_ms: 100
    transmitter: ECU
    signals:
      - name: 'Engine_Limiter_Max_RPM'
        id: rev_limit_rpm
        category: engine
        description: 'Current engine limiter maximum RPM'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: 'rpm'

      - name: 'Cut_Percentage'
        id: cut_percentage
        category: engine
        description: 'Current cut percentage'
        start_bit: 8
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'
        disputed: 'Overlaps Engine_Limiter_Max_RPM (bits 0-15). Both available
          transcriptions of the Haltech protocol — ours and rusEFI''s
          can_dash_haltech.dbc — record bit 8, but two 16-bit fields cannot both
          start 8 bits apart. Byte 2 (start_bit 16) is the likely intent.
          Unresolved until Haltech''s own protocol PDF can be checked.'

  # 0x6F7 - Generic Outputs and Misc (10Hz)
  - id: 0x6F7
    name: 'Generic Outputs Status'
    description: 'Generic output states, calculated air temp, water injection'
    length: 8
    interval_ms: 100
    transmitter: ECU
    signals:
      - name: 'Calculated_Air_Temperature'
        id: charge_temp
        category: temperature
        description: 'Calculated air temperature'
        start_bit: 32
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'Water_Injection_Solenoid_Duty_Cycle'
        id: water_injection_duty
        category: engine
        description: 'Water injection solenoid duty cycle'
        start_bit: 48
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'

  # ============================================================================
  # SLOW MESSAGES (5Hz)
  # ============================================================================

  # 0x3E0 - Core Temperatures (5Hz)
  - id: 0x3E0
    name: 'Core Temperatures'
    description: 'Coolant, air, fuel, and oil temperatures'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'Coolant_Temperature'
        id: coolant_temp
        category: temperature
        description: 'Engine coolant temperature'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'
        comment: 'Value in deciKelvin. For Celsius: y = x/10 - 273.15'

      - name: 'Air_Temperature'
        id: iat
        category: temperature
        description: 'Intake air temperature'
        start_bit: 16
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'Fuel_Temperature'
        id: fuel_temp
        category: temperature
        description: 'Fuel temperature'
        start_bit: 32
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'Oil_Temperature'
        id: oil_temp
        category: temperature
        description: 'Engine oil temperature'
        start_bit: 48
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

  # 0x3E1 - Extended Temperatures (5Hz)
  - id: 0x3E1
    name: 'Extended Temperatures'
    description: 'Gearbox, diff temperatures and fuel composition'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'Gearbox_Oil_Temperature'
        id: gearbox_temp
        category: temperature
        description: 'Gearbox oil temperature'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'Diff_Oil_Temperature'
        id: differential_temp
        category: temperature
        description: 'Differential oil temperature'
        start_bit: 16
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'Fuel_Composition'
        id: flex_ethanol
        category: fuel
        description: 'Fuel composition (ethanol content)'
        start_bit: 32
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'

  # 0x3E2 - Fuel Level (5Hz)
  - id: 0x3E2
    name: 'Fuel Level'
    description: 'Fuel tank level'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'Fuel_Level'
        id: fuel_level
        category: fuel
        description: 'Fuel tank level'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'L'

  # 0x3E3 - Fuel Trims (5Hz)
  - id: 0x3E3
    name: 'Fuel Trims'
    description: 'Short and long term fuel trims for both banks'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'Fuel_Trim_Short_Term_Bank_1'
        id: fuel_trim_short_bank_1
        category: engine
        description: 'Short term fuel trim bank 1'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'Fuel_Trim_Short_Term_Bank_2'
        id: fuel_trim_short_bank_2
        category: engine
        description: 'Short term fuel trim bank 2'
        start_bit: 16
        length: 16
        byte_order: big_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'Fuel_Trim_Long_Term_Bank_1'
        id: fuel_trim_long_bank_1
        category: engine
        description: 'Long term fuel trim bank 1'
        start_bit: 32
        length: 16
        byte_order: big_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'Fuel_Trim_Long_Term_Bank_2'
        id: fuel_trim_long_bank_2
        category: engine
        description: 'Long term fuel trim bank 2'
        start_bit: 48
        length: 16
        byte_order: big_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: '%'

  # 0x469 - ECU Temperature (5Hz)
  - id: 0x469
    name: 'ECU Temperature'
    description: 'ECU internal temperature'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'ECU_Temperature'
        id: ecu_temp
        category: system
        description: 'ECU internal temperature'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

  # 0x475 - Fuel Pump Duty Cycles (5Hz)
  - id: 0x475
    name: 'Fuel Pump Duty Cycles'
    description: 'Fuel pump duty cycles'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'Primary_Fuel_Pump_Duty_Cycle'
        id: fuel_pump_duty
        category: engine
        description: 'Primary fuel pump duty cycle'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'Aux_1_Fuel_Pump_Duty_Cycle'
        vendor_specific: true
        description: 'Auxiliary fuel pump 1 duty cycle'
        start_bit: 16
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'Aux_2_Fuel_Pump_Duty_Cycle'
        vendor_specific: true
        description: 'Auxiliary fuel pump 2 duty cycle'
        start_bit: 32
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'

      - name: 'Aux_3_Fuel_Pump_Duty_Cycle'
        vendor_specific: true
        description: 'Auxiliary fuel pump 3 duty cycle'
        start_bit: 48
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: '%'

  # 0x6F0 - Tyre Pressures (5Hz)
  - id: 0x6F0
    name: 'Tyre Pressures'
    description: 'Individual tyre pressure monitoring'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'Front_Left_Tyre_Pressure'
        id: tyre_pressure_fl
        category: pressure
        description: 'Front left tyre pressure (gauge)'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: -101.3
        unit: 'kPa'
        comment: '0 = error'

      - name: 'Front_Right_Tyre_Pressure'
        id: tyre_pressure_fr
        category: pressure
        description: 'Front right tyre pressure (gauge)'
        start_bit: 16
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: -101.3
        unit: 'kPa'

      - name: 'Rear_Left_Tyre_Pressure'
        id: tyre_pressure_rl
        category: pressure
        description: 'Rear left tyre pressure (gauge)'
        start_bit: 32
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: -101.3
        unit: 'kPa'

      - name: 'Rear_Right_Tyre_Pressure'
        id: tyre_pressure_rr
        category: pressure
        description: 'Rear right tyre pressure (gauge)'
        start_bit: 48
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: -101.3
        unit: 'kPa'

  # 0x6F1 - Tyre Temperatures (5Hz)
  - id: 0x6F1
    name: 'Tyre Temperatures'
    description: 'Individual tyre temperature monitoring'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'Front_Left_Tyre_Temperature'
        id: tyre_temp_fl
        category: temperature
        description: 'Front left tyre temperature'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'
        comment: '0 = error'

      - name: 'Front_Right_Tyre_Temperature'
        id: tyre_temp_fr
        category: temperature
        description: 'Front right tyre temperature'
        start_bit: 16
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'Rear_Left_Tyre_Temperature'
        id: tyre_temp_rl
        category: temperature
        description: 'Rear left tyre temperature'
        start_bit: 32
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

      - name: 'Rear_Right_Tyre_Temperature'
        id: tyre_temp_rr
        category: temperature
        description: 'Rear right tyre temperature'
        start_bit: 48
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: 0
        unit: 'K'

  # 0x6F2 - Tyre Sensor Batteries (5Hz)
  - id: 0x6F2
    name: 'Tyre Sensor Batteries'
    description: 'TPMS sensor battery voltages'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'Front_Left_Tyre_Sensor_Battery'
        vendor_specific: true
        description: 'Front left TPMS battery voltage'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.001
        offset: 0
        unit: 'V'
        comment: '0 = error'

      - name: 'Front_Right_Tyre_Sensor_Battery'
        vendor_specific: true
        description: 'Front right TPMS battery voltage'
        start_bit: 16
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.001
        offset: 0
        unit: 'V'

      - name: 'Rear_Left_Tyre_Sensor_Battery'
        vendor_specific: true
        description: 'Rear left TPMS battery voltage'
        start_bit: 32
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.001
        offset: 0
        unit: 'V'

      - name: 'Rear_Right_Tyre_Sensor_Battery'
        vendor_specific: true
        description: 'Rear right TPMS battery voltage'
        start_bit: 48
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.001
        offset: 0
        unit: 'V'

  # 0x6F3 - Tyre Recommended Pressures and Protection (5Hz)
  - id: 0x6F3
    name: 'Tyre Settings and Protection'
    description: 'Recommended tyre pressures, leak detection, engine protection'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'Front_Tyre_Recommended_Pressure'
        vendor_specific: true
        description: 'Front tyre recommended pressure (gauge)'
        start_bit: 0
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: -101.3
        unit: 'kPa'

      - name: 'Rear_Tyre_Recommended_Pressure'
        vendor_specific: true
        description: 'Rear tyre recommended pressure (gauge)'
        start_bit: 16
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 0.1
        offset: -101.3
        unit: 'kPa'

      - name: 'Engine_Protection_Severity_Level'
        id: engine_protection_severity
        category: system
        description: 'Engine protection severity (0=Idle, 1-3=Levels)'
        start_bit: 40
        length: 8
        byte_order: big_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: ''

      - name: 'Engine_Protection_Reason'
        vendor_specific: true
        description: 'Engine protection OBDII DTC code'
        start_bit: 48
        length: 16
        byte_order: big_endian
        data_type: unsigned
        scale: 1.0
        offset: 0
        unit: ''
        comment: 'Upper 2 bits: letter (0=P,1=B,2=C,3=U), lower 14 bits: code'

  # 0x6F6 - Trip Data (5Hz)
  - id: 0x6F6
    name: 'Trip Data'
    description: 'Trip fuel used and trip meter'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'Total_Fuel_Used_Since_Trip_1_Reset'
        id: fuel_used
        category: fuel
        description: 'Fuel used since trip 1 reset'
        start_bit: 0
        length: 32
        byte_order: big_endian
        data_type: signed
        scale: 1.0
        offset: 0
        unit: 'cc'

      - name: 'Trip_Meter_1'
        id: trip_distance
        category: position
        description: 'Trip meter 1 distance'
        start_bit: 32
        length: 32
        byte_order: big_endian
        data_type: signed
        scale: 1.0
        offset: 0
        unit: 'm'

  # 0x6F8 - Motor Control States (5Hz)
  - id: 0x6F8
    name: 'Motor Control States'
    description: 'Exhaust cutout, nitrous bottle, motor control states'
    length: 8
    interval_ms: 200
    transmitter: ECU
    signals:
      - name: 'Exhaust_Cutout_State'
        vendor_specific: true
        description: 'Exhaust cutout motor state'
        start_bit: 0
        length: 8
        byte_order: big_endian
        data_type: signed
        scale: 1.0
        offset: 0
        unit: ''
        comment: '-1=Error, 0=Disabled, 1=Closed, 2=Opening, 3=Open, 4=Closing, 5=Paused'

      - name: 'Nitrous_Bottle_Opener_State'
        vendor_specific: true
        description: 'Nitrous bottle opener state'
        start_bit: 8
        length: 8
        byte_order: big_endian
        data_type: signed
        scale: 1.0
        offset: 0
        unit: ''

      - name: 'Generic_Motor_Control_1_State'
        vendor_specific: true
        description: 'Generic open loop motor control 1 state'
        start_bit: 16
        length: 8
        byte_order: big_endian
        data_type: signed
        scale: 1.0
        offset: 0
        unit: ''

      - name: 'Generic_Motor_Control_2_State'
        vendor_specific: true
        description: 'Generic open loop motor control 2 state'
        start_bit: 24
        length: 8
        byte_order: big_endian
        data_type: signed
        scale: 1.0
        offset: 0
        unit: ''

      - name: 'Generic_Motor_Control_3_State'
        vendor_specific: true
        description: 'Generic open loop motor control 3 state'
        start_bit: 32
        length: 8
        byte_order: big_endian
        data_type: signed
        scale: 1.0
        offset: 0
        unit: ''

# Enumerations for special values
enums:
  - name: 'TractionControlState'
    description: 'Traction control state values'
    values:
      '-1': 'Function Disabled'
      '0': 'Idle'
      '2': 'Active'
      '4': 'Ramp Out'
      '5': 'Disabled by Switch'

  - name: 'MotorControlState'
    description: 'Motor control state values'
    values:
      '-1': 'Input Error'
      '0': 'Disabled'
      '1': 'Closed'
      '2': 'Opening'
      '3': 'Open'
      '4': 'Closing'
      '5': 'Paused Part Way'

  - name: 'CutMethod'
    description: 'Engine cut method'
    values:
      '0': 'No Cut'
      '1': 'Fuel'
      '2': 'Ignition'
      '3': 'Fuel and Ignition'

  - name: 'CruiseControlState'
    description: 'Cruise control controller states'
    values:
      '0': 'Disabled'
      '1': 'Inactive'
      '2': 'Cruising'
      '3': 'Accelerating'
      '4': 'Decelerating'

  - name: 'EngineProtectionSeverity'
    description: 'Engine protection severity levels'
    values:
      '0': 'Idle'
      '1': 'Level 1'
      '2': 'Level 2'
      '3': 'Level 3'

metadata:
  author: 'OpenECU Alliance'
  license: 'MIT'
  source_url: 'https://support.haltech.com/portal/en/kb/articles/haltech-can-ecu-broadcast-protocol'
  tested_with:
    - 'Haltech Nexus R5'
    - 'Haltech Elite 2500'
    - 'Haltech Elite 1500'
    - 'Haltech Elite 950'
    - 'Haltech Elite 750'
    - 'Haltech Elite 550'
  compatible_tools:
    - 'CANalyzer'
    - 'PCAN-View'
    - 'SavvyCAN'
    - 'BusMaster'
    - 'RaceChrono'
    - 'AiM data loggers'
    - 'MoTeC C1 series'
    - 'Haltech IC7 Dash'
  known_issues:
    - 'Not all messages broadcast if features not enabled in ECU'
    - 'Rates are not guaranteed'
    - "Protocol can change at Haltech's discretion"
    - 'Non-Haltech products on same CAN bus may cause ID conflicts'
    - 'Temperatures are in deciKelvin (divide by 10 for Kelvin, subtract 273.15 for Celsius)'
    - 'Gauge pressures use offset -101.3 kPa from raw value'
  changelog:
    - version: '3.1.0'
      date: '2026-08-24'
      changes:
        - 'Add canonical channel ids and categories to signals, drawn from the registry
          in specs/channels.yaml. 145 of 185 signals (78%) now carry one, so a CAN
          measurement can be matched to the same measurement read from a log file.
          Before this, no protocol signal carried an id at all.'
        - 'Account for the rest explicitly instead of leaving them silent: 40 marked
          vendor_specific (a real measurement with no canonical equivalent) and 0
          marked reserved (padding or diagnostic transport framing, which carry no
          measurement).'
    - version: '3.0.0'
