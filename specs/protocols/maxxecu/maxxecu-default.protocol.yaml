  - id: 0x522
    name: 'Fuel and Vehicle Speed'
    description: 'Primary injector pulsewidth and duty, fuel cut, vehicle speed'
    length: 8
    interval_ms: 20
    transmitter: ECU
    vendor_message_name: 'FAST3'
    min_firmware: '1.67'
