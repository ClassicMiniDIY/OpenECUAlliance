        scale: 0.1
        offset: 0
        unit: '%'
        min: -3276.8
        max: 3276.7
        comment: 'Can be over 100%.'

      - name: 'Fuel_Cut'
        description: 'Fuel cut'
        start_bit: 32
        length: 16
