metadata:
  author: 'OpenECU Alliance'
  license: 'MIT'
  source_url: 'https://www.maxxecu.com/webhelp/can-default_maxxecu_protocol.html'
  vendor_protocol_version: '1.3 (2020-09-29)'
  tested_with:
    - 'MaxxECU RACE'
    - 'MaxxECU STREET'
    - 'MaxxECU MINI'
    - 'MaxxECU SPORT'
    - 'MaxxECU PRO'
  compatible_tools:
    - 'MTune'
    - 'AiM data loggers'
    - 'RaceChrono'
    - 'SavvyCAN'
    - 'PCAN-View'
    - 'BusMaster'
  known_issues:
    - 'Message IDs are fixed. The 0x600 base address in MaxxECU documentation
      belongs to the Expansion Module setup, not to this protocol.'
    - 'Messages 0x525-0x528 and 0x537-0x542 require firmware 1.135 or newer;
      0x535 requires 1.79 or newer; the ECU error code field in 0x542 requires
      1.149 or newer. Older firmware simply does not transmit them.'
    - 'Vendor protocol v1.3 uses 0x536 bytes 2-3, which were SPARE in v1.2.
      Vendor note: "Default V1.3 0x540 collides with the VAG DSG" — use v1.2
      on DSG applications.'
    - 'Traction control channels in 0x523 and 0x524 read zero when the traction
      control system is not in use.'
    - 'Ethanol concentration in 0x531 outputs 85% when no sensor is fitted or
      the sensor has failed.'
    - 'All eight EGT values are transmitted even for unconfigured sensors.'
  changelog:
    - version: '2.0.0'
      date: '2026-08-24'
      changes:
        - 'BREAKING: correct the CAN IDs. 1.0.0 declared 25 messages at
          0x600-0x618, which do not exist in this protocol. The documented IDs
          are 0x520-0x528 and 0x530-0x542.'
        - 'BREAKING: correct the baud rate from 1 Mbit/s to 500 kbit/s, per the
          vendor webhelp ("Can baud rate: 500kbit, 11-bit ID") and AiM MaxxECU
          CAN 1.05 ("CAN1 Bitrate as 500kbit").'
        - 'Rebuild every message and signal directly from the vendor table:
          22 messages, 100 signals, with vendor byte offsets, scales and units.'
        - 'Add per-message minimum firmware versions and the vendor message
          names (FAST1-FAST9, SLOW1-SLOW13).'
        - 'Remove the claim that the base address is configurable — it is not
          for this protocol.'
    - version: '1.0.0'
      date: '2026-01-07'
      changes:
        - 'Initial release. Message IDs, baud rate and message layout did not
          match the vendor documentation; superseded by 2.0.0.'

# MaxxECU-specific notes
x_maxxecu:
  bus:
    baudrate: 500000
    id_length: 11
    byte_order: little_endian
    bus_load: '~13% additional load when enabled (vendor protocol v1.3)'
    termination: 'Built-in on CAN 1 for all models. MaxxECU PRO CAN 2 has none.
      External 120 ohm termination recommended over 1 m of bus.'
    wiring: 'Twisted pink/grey. Pink = CAN L, grey = CAN H.'
  message_groups:
    fast: '0x520-0x528 at 50 Hz'
    slow: '0x530-0x542 at 10 Hz'
  enabling: 'MTune -> CAN -> enable the MaxxECU output protocol.'
  dbc: 'MaxxECU publishes DBC files in the download section of maxxecu.com.'
