# OpenECU Alliance Protocol Definition
# MaxxECU Default CAN Output Protocol
#
# Source: MaxxECU webhelp, "MaxxECU Default CAN output"
# https://www.maxxecu.com/webhelp/can-default_maxxecu_protocol.html
# Vendor protocol version 1.3 (2020-09-29); includes all of version 1.2 (2014-12-05).
#
# IMPORTANT NOTES:
# - CAN baud rate is 500 kbit/s with 11-bit IDs. This is fixed by the vendor
#   documentation and is NOT the same as MaxxECU's Expansion Module base
#   address (0x600), which is a different feature on a different bus config.
# - Message IDs are fixed at 0x520-0x528 (FAST, 50 Hz) and 0x530-0x542
#   (SLOW, 10 Hz). The default output protocol has no configurable base address.
# - Little endian (least significant byte first).
# - Every message is 8 bytes. Most carry four 16-bit values.
# - All MaxxECUs have a built-in termination resistor on CAN 1. MaxxECU PRO's
#   secondary bus (CAN 2) does not.
# - Loom: twisted pink/grey. Pink = CAN L, grey = CAN H.

openecualliance: '1.0'
type: protocol

id: maxxecu-default
name: 'MaxxECU Default CAN Protocol'
version: '2.0.0'
vendor: maxxecu
description: |
  Default CAN output protocol for MaxxECU engine management systems, as
  published in the MaxxECU webhelp (vendor protocol version 1.3).

  Uses 11-bit identifiers at 500 kbit/s with little-endian encoding. Messages
  are fixed at 0x520-0x528 (50 Hz) and 0x530-0x542 (10 Hz); there is no
  configurable base address for this protocol. Enabling it adds roughly 13%
  CAN bus load.

  Supports MaxxECU RACE, STREET, MINI, SPORT and PRO. Individual messages
  require specific firmware versions, recorded per message below.

website: 'https://www.maxxecu.com/webhelp/can-default_maxxecu_protocol.html'

branding:
  logo: maxxecu-logo.jpg
  icon: maxxecu-icon.jpg
  color_primary: '#0066CC'
  color_secondary: '#FFFFFF'

protocol:
  type: can
  baudrate: 500000
  extended_id: false
  base_address_configurable: false

messages:

  # ==========================================================================
  # 0x520 - Engine Core (FAST1, 50Hz)
  # ==========================================================================
  - id: 0x520
    name: 'Engine Core'
    description: 'Engine speed, throttle, manifold pressure and average lambda'
    length: 8
    interval_ms: 20
    transmitter: ECU
    vendor_message_name: 'FAST1'
    min_firmware: '1.67'
    signals:
      - name: 'RPM'
        description: 'RPM'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 1.0
        offset: 0
        unit: 'rpm'
        min: 0
        max: 32767.0

      - name: 'Throttle_Position_Pedal'
        description: 'Throttle position/pedal'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: '%'
        min: -3276.8
        max: 3276.7

      - name: 'MAP'
        description: 'MAP'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'kPa'
        min: 0
        max: 3276.7

      - name: 'Lambda'
        description: 'Lambda'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.001
        offset: 0
        unit: 'lambda'
        min: 0
        max: 32.767
        comment: 'Average lambda'

  # ==========================================================================
  # 0x521 - Lambda and Ignition (FAST2, 50Hz)
  # ==========================================================================
  - id: 0x521
    name: 'Lambda and Ignition'
    description: 'Per-bank lambda, ignition angle and ignition cut'
    length: 8
    interval_ms: 20
    transmitter: ECU
    vendor_message_name: 'FAST2'
    min_firmware: '1.67'
    signals:
      - name: 'Lambda_A'
        description: 'Lambda A'
        start_bit: 0
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.001
        offset: 0
        unit: 'lambda'
        min: 0
        max: 32.767
        comment: 'Lambda cylinder bank A'

      - name: 'Lambda_B'
        description: 'Lambda B'
        start_bit: 16
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.001
        offset: 0
        unit: 'lambda'
        min: 0
        max: 32.767
        comment: 'Lambda cylinder bank B'

      - name: 'Ignition_Angle'
        description: 'Ignition angle'
        start_bit: 32
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 0.1
        offset: 0
        unit: 'deg'
        min: -3276.8
        max: 3276.7

      - name: 'Ignition_Cut'
        description: 'Ignition cut'
        start_bit: 48
        length: 16
        byte_order: little_endian
        data_type: signed
        scale: 1.0
        offset: 0
        unit: '%'
        min: -32768.0
        max: 32767.0
        comment: 'Percent of ignition event being cut (for rev-limit etc)'

  # ==========================================================================
  # 0x522 - Fuel and Vehicle Speed (FAST3, 50Hz)
